name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Golden examples verification
        run: npm run test:golden --if-present

      - name: Trust eval gate (synthetic fixtures)
        run: npm run evals --if-present

      - name: Comparison scorecard generation
        run: npm run evals:compare --if-present

      - name: Build library
        run: npm run build --if-present

      - name: Build demo
        run: npm run build:demo --if-present

      - name: Verify package boundary
        run: npm run verify:package --if-present

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Smoke test
        run: npm run smoke --if-present

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: |
            evals/reports/latest.json
            evals/reports/public-scorecard.json
            evals/reports/public-comparison-scorecard.json

  auth-lifecycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify API key lifecycle
        run: npm run verify:dev-keys --if-present
